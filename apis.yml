aid: worldfirst
url: https://raw.githubusercontent.com/api-evangelist/worldfirst/refs/heads/main/apis.yml
name: WorldFirst
kind: company
description: >-
  WorldFirst is a United Kingdom-founded cross-border payments and money-movement
  company, headquartered in London and owned by Ant Group (Alipay) since 2019. It
  gives online sellers, marketplaces, and SMEs a multi-currency World Account to
  collect, hold, convert, and send money across borders, alongside a World Card
  for multi-currency spending and marketplace/supplier payouts. Its home market is
  the United Kingdom, but its book is global e-commerce and cross-border trade,
  serving merchants selling on Amazon and other marketplaces. WorldFirst ships a
  genuine, API-native developer platform at developers.worldfirst.com built on Ant
  Group's Antom-style gateway (open-sea/open-eu/open-na hosts, /amsin/api/v1 paths):
  a RESTful, JSON, HTTPS-only interface segmented into an Enterprise Solution
  (account, beneficiary, FX, transfer, payout, invoicing, virtual-card credit),
  a Pay Solution (Cashier Payment / online checkout acceptance for merchants), and
  a WorldTrade Solution (cross-border trade orders). Requests are secured with
  RSA256/ECC224 digital signatures plus OAuth 2.0 access tokens; asynchronous
  notifications (webhooks) return payment and trade-order results. The public
  reference is documentation-and-console only — the underlying OpenAPI/Swagger is
  not offered as a downloadable spec (the gateway blocks anonymous spec fetches),
  so integration is gated behind partner onboarding and the console's iMock/iTest
  tooling.
