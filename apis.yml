apis:
- aid: worldfirst:worldfirst-enterprise-solution-api
  name: WorldFirst Enterprise Solution API
  description: >-
    The WorldFirst Enterprise Solution (World Account) API — a RESTful, JSON,
    signed-request interface covering customer onboarding, account and beneficiary
    management, statements, foreign exchange, transfer, payout, invoicing, and
    virtual-card (VC) credit for globally based partners and customers. Requests
    are signed with RSA256/ECC224 and carry an OAuth 2.0 Access-Token; no
    downloadable OpenAPI is published.
  humanURL: https://developers.worldfirst.com.cn/docs/alipay-worldfirst/worldfirst_enterprise_solution/api_overview
  baseURL: https://open-sea.worldfirst.com/amsin/api/v1
  tags:
  - Enterprise
  - World Account
  - Foreign Exchange
  - Payouts
  - Cross-Border
  properties:
  - type: Documentation
    url: https://developers.worldfirst.com.cn/docs/alipay-worldfirst/worldfirst_enterprise_solution/getting_started
  - type: APIReference
    url: https://developers.worldfirst.com.cn/docs/alipay-worldfirst/worldfirst_enterprise_solution/api_overview
- aid: worldfirst:worldfirst-pay-solution-api
  name: WorldFirst Pay Solution API
  description: >-
    The WorldFirst Pay Solution (Cashier Payment) API lets overseas e-commerce
    merchants accept payments through a hosted checkout: create a payment order,
    let the customer complete payment, inquire about payment status, and receive an
    asynchronous payment notification (webhook). RESTful JSON over HTTPS with
    RSA256/ECC224 signed requests; no downloadable OpenAPI is published.
  humanURL: https://developers.worldfirst.com/docs/alipay-worldfirst/cashier_payment/getting_started
  baseURL: https://open-sea.worldfirst.com/amsin/api/v1
  tags:
  - Payment Acceptance
  - Cashier Payment
  - Checkout
  - E-commerce
  properties:
  - type: Documentation
    url: https://developers.worldfirst.com/docs/alipay-worldfirst/cashier_payment/development_via_api
  - type: APIReference
    url: https://developers.worldfirst.com/docs/alipay-worldfirst/cashier_payment/getting_started
- aid: worldfirst:worldfirst-worldtrade-solution-api
  name: WorldFirst WorldTrade Solution API
  description: >-
    The WorldTrade Solution API supports cross-border trade transactions between
    partners and the WorldFirst platform — e.g. inquiryQuotes (FX quote lookup at
    /amsin/api/v1/payments/inquiryQuotes), createTradeOrder to submit a trade order,
    and a WorldFirst-initiated notifyTradeOrderCloseResult asynchronous callback.
    RESTful JSON over HTTPS with RSA256/ECC224 signed requests; no downloadable
    OpenAPI is published.
  humanURL: https://developers.worldfirst.com/docs/alipay-worldfirst/worldtrade_solution/overview
  baseURL: https://open-sea.worldfirst.com/amsin/api/v1
  tags:
  - Cross-Border
  - Trade
  - Foreign Exchange
  - Webhooks
  properties:
  - type: Documentation
    url: https://developers.worldfirst.com/docs/alipay-worldfirst/worldtrade_solution/overview
  - type: APIReference
    url: https://developers.worldfirst.com/docs/alipay-worldfirst/overview/apis
